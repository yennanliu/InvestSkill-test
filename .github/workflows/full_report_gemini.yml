name: Full Report — Gemini (InvestSkill)

# Runs the ENTIRE InvestSkill analysis suite (all 15 full-demo modules) for one
# ticker in a single job, then synthesises a consolidated verdict — mirrors:
#   Install:  git clone yennanliu/InvestSkill   (GEMINI.md auto-loaded as context)
#   Prompts:  prompts/*.md                       (@prompts/<skill>.md, one per module)
#   Demo:     https://yennj12.js.org/InvestSkill/full-demo-rklb.html
#   Data:     live + historical yfinance (shared snapshot across every module)
#   AI:       Google Gemini API  (secret: GEMINI_API_KEY)
#
# Output: output/full_report/<ticker>/full_report_YYYY-MM-DD_<model>.md

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Stock ticker symbol (e.g. AAPL, TSLA, NVDA)"
        required: true
        default: "AAPL"
      model:
        description: "Gemini model"
        required: false
        default: "gemini-2.5-flash"
        type: choice
        options:
          - gemini-2.5-flash
          - gemini-2.5-pro
          - gemini-2.0-flash
      max_tokens:
        description: "Max output tokens per module"
        required: false
        default: "20000"

  schedule:
    # Runs every weekday at 08:35 UTC (offset from the per-skill Gemini jobs).
    - cron: "35 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: "full-report-gemini-${{ github.run_id }}"
  cancel-in-progress: false

jobs:
  full-report-gemini:
    name: Full Report — Gemini
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install InvestSkill — clone so GEMINI.md + all prompts/*.md are available.
      # Mirrors: cd /path/to/InvestSkill && gemini  (auto-loads GEMINI.md)
      - name: Install InvestSkill skill repo
        run: |
          git clone --depth 1 https://github.com/yennanliu/InvestSkill.git InvestSkill
          echo "✅ InvestSkill installed"
          echo ""
          echo "=== GEMINI.md (system context, auto-loaded by gemini CLI) ==="
          head -20 InvestSkill/GEMINI.md
          echo ""
          echo "=== Available prompts/ modules ==="
          ls -1 InvestSkill/prompts/

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install google-generativeai>=0.8.0 yfinance>=0.2.40

      - name: Resolve parameters
        id: params
        run: |
          DEFAULT_TICKER="AAPL"
          DEFAULT_MODEL="gemini-2.5-flash"
          DEFAULT_MAX_TOKENS="20000"

          TICKER="${{ github.event.inputs.ticker }}"
          MODEL="${{ github.event.inputs.model }}"
          MAX_TOKENS="${{ github.event.inputs.max_tokens }}"

          TICKER="${TICKER:-$DEFAULT_TICKER}"
          MODEL="${MODEL:-$DEFAULT_MODEL}"
          MAX_TOKENS="${MAX_TOKENS:-$DEFAULT_MAX_TOKENS}"

          TICKER_UPPER=$(echo "$TICKER" | tr '[:lower:]' '[:upper:]')
          TICKER_LOWER=$(echo "$TICKER" | tr '[:upper:]' '[:lower:]')
          OUTPUT_DIR="output/full_report/${TICKER_LOWER}"

          echo "ticker=${TICKER_UPPER}"     >> "$GITHUB_OUTPUT"
          echo "model=${MODEL}"             >> "$GITHUB_OUTPUT"
          echo "max_tokens=${MAX_TOKENS}"   >> "$GITHUB_OUTPUT"
          echo "output_dir=${OUTPUT_DIR}"   >> "$GITHUB_OUTPUT"

          echo "=== Parameters ==="
          echo "  Ticker:     ${TICKER_UPPER}"
          echo "  Model:      ${MODEL}"
          echo "  Max tokens: ${MAX_TOKENS}"
          echo "  Output dir: ${OUTPUT_DIR}"

      - name: Check GEMINI_API_KEY secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set."
            echo "Add it under: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "✅ GEMINI_API_KEY is set."

      - name: Generate full report — all InvestSkill modules (Gemini)
        timeout-minutes: 35
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/full_report_gemini.py \
            "${{ steps.params.outputs.ticker }}" \
            --model            "${{ steps.params.outputs.model }}" \
            --max-tokens       "${{ steps.params.outputs.max_tokens }}" \
            --output-dir       "${{ steps.params.outputs.output_dir }}" \
            --invest-skill-dir "InvestSkill"

      # Defense-in-depth: the gen script sanitises Mermaid before writing. This
      # lint scans the written report for the known-invalid pattern (a
      # categorical band on y-axis, which xychart-beta rejects) so any residual
      # or novel issue surfaces in the CI log. Pure-Python — no browser needed.
      - name: Validate Mermaid charts
        continue-on-error: true
        run: |
          python - "${{ steps.params.outputs.output_dir }}" <<'PY'
          import glob, pathlib, re, sys
          bad = 0
          for md in glob.glob(f"{sys.argv[1]}/*.md"):
              blocks = re.findall(r"```mermaid\n(.*?)\n```", pathlib.Path(md).read_text(), re.DOTALL)
              for i, b in enumerate(blocks):
                  if "xychart-beta" not in b:
                      continue
                  y = re.search(r"^\s*y-axis(\s+\S.*)$", b, re.MULTILINE)
                  if y and "[" in y.group(1):  # band on the value axis → invalid
                      bad += 1
                      print(f"::warning file={md}::Mermaid block {i}: y-axis holds a "
                            f"categorical band (xychart-beta requires a numeric range)")
          print(f"Mermaid validation: {bad} invalid block(s) found")
          PY

      - name: Commit and push report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "📥 Pulling latest changes..."
          git pull --rebase origin main

          git add "${{ steps.params.outputs.output_dir }}/"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DATE=$(date -u +"%Y-%m-%d")
            TICKER="${{ steps.params.outputs.ticker }}"
            MODEL="${{ steps.params.outputs.model }}"
            git commit -m "chore: auto-generate ${TICKER} full-report ${DATE} [Gemini/${MODEL}]"
            echo "📤 Pushing report..."
            git push
            echo "✅ Report committed and pushed."
          fi
