name: CrewAI Stock Fundamental Analysis

# Multi-agent fundamental analysis using CrewAI + OpenAI.
# Agents: Data Collector → Equity Analyst → Report Writer (Traditional Chinese output)
#
# Output: output/crewai_fundamental_analysis/<ticker>/fundamental_analysis_YYYY-MM-DD_crewai.md

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Stock ticker symbol (e.g. AAPL, TSLA, NVDA)"
        required: true
        default: "AAPL"
      model:
        description: "OpenAI model"
        required: false
        default: "openai/gpt-4o"
        type: choice
        options:
          - openai/gpt-4o
          - openai/gpt-4o-mini

  schedule:
    # Weekdays at 08:00 UTC — edit DEFAULT_TICKER below to change the scheduled stock.
    - cron: "0 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: "crewai-analysis-${{ github.run_id }}"
  cancel-in-progress: false

jobs:
  analyze:
    name: Generate CrewAI Fundamental Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Set up uv ───────────────────────────────────────────────────────
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # ── 3. Resolve parameters ──────────────────────────────────────────────
      - name: Resolve parameters
        id: params
        run: |
          DEFAULT_TICKER="AAPL"
          DEFAULT_MODEL="openai/gpt-4o"

          TICKER="${{ github.event.inputs.ticker }}"
          MODEL="${{ github.event.inputs.model }}"
          TICKER="${TICKER:-$DEFAULT_TICKER}"
          MODEL="${MODEL:-$DEFAULT_MODEL}"

          TICKER_UPPER=$(echo "$TICKER" | tr '[:lower:]' '[:upper:]')
          TICKER_LOWER=$(echo "$TICKER" | tr '[:upper:]' '[:lower:]')
          OUTPUT_DIR="output/crewai_fundamental_analysis/${TICKER_LOWER}"

          echo "ticker=${TICKER_UPPER}"   >> "$GITHUB_OUTPUT"
          echo "model=${MODEL}"           >> "$GITHUB_OUTPUT"
          echo "output_dir=${OUTPUT_DIR}" >> "$GITHUB_OUTPUT"

          echo "=== Parameters ==="
          echo "  Ticker:     ${TICKER_UPPER}"
          echo "  Model:      ${MODEL}"
          echo "  Output dir: ${OUTPUT_DIR}"

      # ── 4. Verify API key ──────────────────────────────────────────────────
      - name: Check OPENAI_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is not set."
            exit 1
          fi
          echo "✅ OPENAI_API_KEY is set."

      # ── 5. Run CrewAI analysis ─────────────────────────────────────────────
      - name: Run CrewAI analysis
        timeout-minutes: 20
        working-directory: scripts/crewai_stock
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uv run python main.py \
            "${{ steps.params.outputs.ticker }}" \
            --model      "${{ steps.params.outputs.model }}" \
            --output-dir "$GITHUB_WORKSPACE/${{ steps.params.outputs.output_dir }}"

      # ── 6. Commit & push report ────────────────────────────────────────────
      - name: Commit and push report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "📥 Pulling latest changes..."
          git pull --rebase origin main

          git add "${{ steps.params.outputs.output_dir }}/"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DATE=$(date -u +"%Y-%m-%d")
            TICKER="${{ steps.params.outputs.ticker }}"
            git commit -m "chore: auto-generate ${TICKER} crewai-analysis ${DATE} [CrewAI]"
            echo "📤 Pushing report..."
            git push
            echo "✅ Report committed and pushed."
          fi
